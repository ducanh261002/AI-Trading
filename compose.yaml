services:
  web:
    build: .
    image: ai-trading-web:latest
    restart: unless-stopped
    env_file: .env.cloud
    environment:
      ATC_HOSTED: "true"
      ATC_DATABASE_PATH: /app/data/command_center.sqlite3
      ATC_OLLAMA_ENABLED: "false"
    volumes:
      - trading_data:/app/data
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.cloud}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.cloud}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  trading_data:
  caddy_data:
  caddy_config:
